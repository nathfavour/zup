<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="24" fill="#000000" />
  <defs>
    <linearGradient id="fav-pink" x1="20" y1="20" x2="80" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="fav-gold" x1="44" y1="50" x2="80" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
  </defs>

  <!-- Upper Speech Segment: Top bar of Z -->
  <path
    d="M 22 22 H 78 L 44 50"
    stroke="url(#fav-pink)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Lower Zap Segment: Electric jog and base of Z -->
  <path
    d="M 44 50 H 64 L 26 78 H 78"
    stroke="url(#fav-gold)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Speech Pointer Tail -->
  <path
    d="M 26 78 L 14 90"
    stroke="url(#fav-gold)"
    stroke-width="11"
    stroke-linecap="round"
  />
</svg>
